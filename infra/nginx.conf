# Visit counter: counting requests (POST) from self-identified robots, automation
# tools and HTTP libraries are answered with 204 and not passed to the counter.
# Reading the number (GET) is not affected. The same pattern classified the
# requests of the front server's log in the visit measurement of 17 Nov 2026.
map $http_user_agent $visit_robot_agent {
    default 0;
    "" 1;
    "~*(googlebot|adsbot-google|mediapartners-google|apis-google|google-inspectiontool|googleother|google-extended|storebot-google|feedfetcher-google|google-read-aloud|google-pagerenderer|bingbot|bingpreview|adidxbot|msnbot|yandex|baiduspider|duckduckbot|duckassistbot|applebot|petalbot|ahrefs|semrush|mj12bot|dotbot|rogerbot|seznambot|sogou|exabot|gptbot|oai-searchbot|chatgpt-user|claudebot|claude-web|claude-searchbot|anthropic-ai|perplexitybot|perplexity-user|ccbot|bytespider|amazonbot|facebookexternalhit|facebookcatalog|meta-externalagent|meta-externalfetcher|twitterbot|linkedinbot|slackbot|discordbot|telegrambot|whatsapp|pinterestbot|ia_archiver|archive\.org_bot|headlesschrome|playwright|puppeteer|phantomjs|selenium|webdriver|lighthouse|pagespeed|gtmetrix|python-requests|python-urllib|python-httpx|aiohttp|httpx|curl/|wget/|go-http-client|okhttp|java/|apache-httpclient|libwww-perl|scrapy|node-fetch|axios/|undici|crawler|spider|scraper|[a-z]bot/|(?:^|[^a-z])bot(?:[^a-z]|$)|^-?$)" 1;
}
map "$request_method:$visit_robot_agent" $visit_automated_post {
    default 0;
    "POST:1" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # The release folder is a copy of the repository. Only the runtime files of
    # the site are served: the entries that scripts/prepare-pages.mjs publishes
    # to GitHub Pages (index.html, 404.html, styles.css, src/, assets/,
    # ATTRIBUTIONS.md, LICENSE). Development files answer 404. These rules must
    # stay before the other regular-expression locations;
    # tests/server-files.test.js checks them against every repository file.
    location ~ "^/(?:docs|infra|media|node_modules|scripts|tests|_site)(?:/|$)" {
        return 404;
    }

    location ~ "(?:^|/)\.(?!well-known(?:/|$))" {
        return 404;
    }

    location ~* "^/(?:readme|design|product|changelog|contributing|code_of_conduct|security|citation)(?:\.[a-z0-9]+)?$" {
        return 404;
    }

    location ~ "^/(?:package|package-lock|npm-shrinkwrap)\.json$" {
        return 404;
    }

    location ~* "\.(?:ps1|psm1|sh|bash|bat|cmd|py|pyc|ya?ml|toml|ini|cfg|conf|env|lock|log|bak|old|orig|swp|tmp|cff)$" {
        return 404;
    }

    # Immutable cache for hashed and static assets
    location ~* \.(?:webp|png|jpe?g|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Styles and JavaScript
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # HTML never cached
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Visit counter API. The counter is addressed by its container name. The
    # address is looked up again every 30 seconds, so a recreated counter is
    # found without reloading nginx.
    location = /api/page-summary {
        access_log off;
        if ($visit_automated_post) { return 204; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $visit_counter ancient-greek-wonders-counter:8766;
        proxy_pass http://$visit_counter/api/visit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Length $content_length;
        proxy_pass_request_body on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location = /api/visit {
        access_log off;
        if ($visit_automated_post) { return 204; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $visit_counter ancient-greek-wonders-counter:8766;
        proxy_pass http://$visit_counter/api/visit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Length $content_length;
        proxy_pass_request_body on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
