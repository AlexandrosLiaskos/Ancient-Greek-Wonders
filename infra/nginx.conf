server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Immutable cache for hashed and static assets
    location ~* \.(?:webp|png|jpe?g|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Styles and JavaScript
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # HTML never cached
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Visit counter API
    location = /api/page-summary {
        access_log off;
        proxy_pass http://ancient-greek-wonders-counter:8766/api/visit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Length $content_length;
        proxy_pass_request_body on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location = /api/visit {
        access_log off;
        proxy_pass http://ancient-greek-wonders-counter:8766/api/visit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Content-Length $content_length;
        proxy_pass_request_body on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
